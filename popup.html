<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --ink: #16202c;
        --muted: #64748b;
        --paper: #ffffff;
        --wash: #f4f6f8;
        --line: #dde3ea;
        --calm: #1f7a68;
        --amber: #b87400;
        --scarlet: #c8102e;
        --mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
      }

      * { box-sizing: border-box; }

      body {
        width: 372px;
        margin: 0;
        font: 13px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: var(--ink);
        background: var(--wash);
      }

      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        padding: 12px 14px 10px;
        background: var(--ink);
        color: #fff;
      }

      header h1 {
        margin: 0;
        font-size: 12px;
        font-weight: 650;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      #status {
        font: 11px/1 var(--mono);
        color: #93a3b5;
      }

      #list { padding: 8px; display: grid; gap: 8px; }

      .ticket {
        background: var(--paper);
        border: 1px solid var(--line);
        border-left: 3px solid var(--state);
        border-radius: 4px;
        padding: 9px 11px 10px;
        cursor: pointer;
        transition: border-color 0.12s ease, transform 0.12s ease;
      }

      .ticket:hover { transform: translateX(1px); border-color: var(--state); }
      .ticket:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

      .top {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }

      .id { font: 12px/1 var(--mono); font-weight: 600; letter-spacing: 0.01em; }

      .countdown {
        font: 15px/1 var(--mono);
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        color: var(--state);
      }

      .customer {
        margin-top: 4px;
        font-size: 12.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .meta {
        margin-top: 2px;
        font-size: 11px;
        color: var(--muted);
      }

      /* Signature element: a bar that drains toward the deadline. */
      .drain {
        margin-top: 8px;
        height: 3px;
        background: var(--line);
        border-radius: 2px;
        overflow: hidden;
      }

      .drain span {
        display: block;
        height: 100%;
        background: var(--state);
        transition: width 1s linear;
      }

      .empty {
        padding: 34px 22px;
        text-align: center;
        color: var(--muted);
      }

      .empty strong { display: block; color: var(--ink); margin-bottom: 4px; font-size: 13px; }

      footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 12px;
        border-top: 1px solid var(--line);
        background: var(--paper);
        font-size: 11.5px;
        color: var(--muted);
      }

      footer button {
        border: 1px solid var(--line);
        background: var(--paper);
        color: var(--ink);
        border-radius: 3px;
        padding: 4px 9px;
        font: inherit;
        cursor: pointer;
      }

      footer button:hover { border-color: var(--ink); }

      @media (prefers-reduced-motion: reduce) {
        .ticket, .drain span { transition: none; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Response queue</h1>
      <span id="status">--</span>
    </header>
    <div id="list"></div>
    <footer>
      <span id="scan">No scan yet</span>
      <button id="settings">Settings</button>
    </footer>
    <script src="work-hours.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
